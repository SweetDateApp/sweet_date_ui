name: CI

on:
  pull_request:
    branches: [preprod, prod]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: Branch policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Only preprod can be merged into prod
        if: github.base_ref == 'prod' && github.head_ref != 'preprod'
        run: |
          echo "::error::Les PR vers 'prod' doivent venir de 'preprod' (reçu : '${{ github.head_ref }}')."
          exit 1
      - run: echo "OK — ${{ github.head_ref }} -> ${{ github.base_ref }}"

  build:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check & build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000/api
