name: CD

# preprod -> environnement GitHub "preprod"    -> déploiement Vercel "preview"
# prod    -> environnement GitHub "production" -> déploiement Vercel "production"
# VITE_API_URL est lu depuis les variables d'environnement du projet Vercel.
on:
  push:
    branches: [preprod, prod]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Vercel (${{ github.ref_name }})
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'prod' && 'production' || 'preprod' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ENV: ${{ github.ref_name == 'prod' && 'production' || 'preview' }}
      PROD_FLAG: ${{ github.ref_name == 'prod' && '--prod' || '' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check secrets
        run: |
          for v in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v manquant dans l'environnement GitHub."; exit 1; fi
          done

      - name: Pull Vercel settings
        run: npx --yes vercel@latest pull --yes --environment=$VERCEL_ENV --token=$VERCEL_TOKEN

      - name: Build
        run: npx --yes vercel@latest build $PROD_FLAG --token=$VERCEL_TOKEN

      - name: Deploy
        id: deploy
        run: |
          url=$(npx --yes vercel@latest deploy --prebuilt $PROD_FLAG --token=$VERCEL_TOKEN)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Déployé sur $url"
